# Dependabot keeps the CI action versions current.
#
# Only the `github-actions` ecosystem is enabled. Python dependencies are
# deliberately excluded: this is a dose engine whose numbers depend on NumPy's
# `Generator` streams and SciPy's quadrature, so a dependency bump is a physics
# change that has to be argued and measured (AGENTS.md 8), not merged because a
# bot opened it. The Goudsmit-Saunderson grid cache keys itself on the NumPy
# feature version for exactly this reason.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

    # Dependabot targets the repository's default branch, which is `main` — and
    # `main` accepts merge commits from `rc/*` only (AGENTS.md 9.3). Send these
    # to the integration branch instead, where every other change lands.
    target-branch: develop

    # One PR for all of them. These move together, they are verified by the same
    # CI run, and a separate PR per action would be five reviews of one decision.
    groups:
      actions:
        patterns: ["*"]

    # `ci(deps): bump ...`, the convention of AGENTS.md 9.2. The PR title is the
    # squash-merge subject on `develop`, so it is held to that shape in review.
    commit-message:
      prefix: ci
      include: scope

    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5
