site_name: pyRadMC
site_description: Fast photon Monte Carlo dose engine for radiotherapy treatment planning
site_url: https://pyradmc.readthedocs.io
repo_url: https://github.com/e0404/pyRadMC
repo_name: e0404/pyRadMC
edit_uri: edit/main/docs/
copyright: Apache-2.0

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  # Lets the docs include CONTRIBUTING.md from the repository root rather than
  # duplicating it: one file to keep correct, not two that drift.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Validation status: validation.md
  - Cross-section data: data.md
  - API reference: api.md
  - Decision record: decisions.md
  - Contributing: contributing.md

watch:
  - pyradmc
