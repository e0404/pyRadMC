[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyRadMC"
# Single-sourced from pyradmc/__init__.py: the module is the one place the version
# lives, so a release tag can never disagree with what the package reports at runtime
# (and with what every RunProvenance record stamps onto a result).
dynamic = ["version"]
description = "Fast photon Monte Carlo engine for beamlet-resolved radiotherapy treatment planning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Niklas Wahl" , email = "n.wahl@dkfz-heidelberg.de"}]
keywords = ["monte-carlo", "radiotherapy", "dose-calculation", "treatment-planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

# Core stays deliberately thin. The reference backend needs nothing but NumPy.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Production backend. Apache-2.0. CUDA GPU and CPU from one source.
warp = ["warp-lang>=1.12"]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    # Pinned to a minor line, not floated. ruff's formatter is a CI gate, and a gate
    # whose behaviour changes on someone else's release schedule is not a gate: an
    # unpinned ">=0.5" once picked up a release that had graduated Markdown formatting
    # out of preview and reformatted the README. The authoritative version is the rev in
    # .pre-commit-config.yaml, which CI runs; this bound keeps a local `ruff` in step.
    "ruff>=0.15.1,<0.16",
    "pre-commit>=3.7",
]
# Documentation. mkdocs-material: MIT. mkdocstrings[python]: ISC (griffe/handler: ISC/MIT).
# All docs-only; none of this is imported by the engine at runtime.
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
# Runnable demonstration scripts under examples/ (AGENTS.md section 7); not needed to use
# the engine. matplotlib license: BSD-style, permissive.
examples = ["matplotlib>=3.8"]
# CT image adapter (pyradmc.adapters.ct), optional and out of the core. SimpleITK
# license: Apache-2.0, permissive. Reads DICOM/NIfTI/MetaImage into a VoxelGrid.
ct = ["SimpleITK>=2.3"]
all = ["pyRadMC[warp,dev,docs,examples,ct]"]

[project.urls]
# Development happens on the DKFZ GitLab; the GitHub mirror is what the outside world
# reaches, and is where CI, ReadTheDocs and the PyPI release run from.
Homepage = "https://github.com/e0404/pyRadMC"
Documentation = "https://pyradmc.readthedocs.io"
Repository = "https://github.com/e0404/pyRadMC"
Issues = "https://github.com/e0404/pyRadMC/issues"
Changelog = "https://github.com/e0404/pyRadMC/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "pyradmc/__init__.py"

[tool.hatch.build.targets.sdist]
# Tests and examples ship: this is scientific software, and a user who wants to verify a
# dose should not have to clone to run the suite. Agent configuration does not.
exclude = [".claude"]

[tool.hatch.build.targets.wheel]
packages = ["pyradmc"]
# PEP 561: the package is typed, and consumers (the pyRadPlan adapter first among
# them) only see that if the marker ships in the wheel.
artifacts = ["pyradmc/py.typed"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Default run is the fast tiers only; see AGENTS.md 4.
addopts = "-m 'not validation and not perf' --strict-markers --strict-config -ra"
markers = [
    "validation: slow, high-statistics physical validation against published data",
    "perf: benchmarks; alerts on regression, not pass/fail",
    "gpu: requires a CUDA device",
    "warp: requires the warp-lang optional dependency",
    "ct: requires the SimpleITK optional dependency",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# Typing. Warp kernels are exempt; see AGENTS.md 5.
# ---------------------------------------------------------------------------
[tool.mypy]
# No pinned python_version: modern numpy ships PEP 695 stubs that mypy refuses to parse
# under 3.10 semantics. Types are checked under the interpreter mypy runs on; the 3.10
# floor is guarded by ruff's target-version and the py3.10 job in the CI test matrix.
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
# rng.warp_shim is Warp kernel code (AGENTS.md 5: kernels are exempt, marked).
module = ["pyradmc.backends.warp.*", "pyradmc.rng.warp_shim"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["warp.*", "scipy.*", "SimpleITK.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# SimpleITK is an untyped boundary: its Image methods carry no annotations, so the
# strict disallow_untyped_calls fires on GetSpacing/GetOrigin/etc. The adapter's own
# code stays typed; only the calls across that boundary are exempt.
module = ["pyradmc.adapters.ct"]
disallow_untyped_calls = false

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
# Documentation is not formatter-managed. Newer ruff formats Python inside Markdown code
# blocks, which is off by default only until that feature stabilizes -- so state the
# intent here rather than depend on the version. Docs samples are prose: they use elision
# (`...`), they align trailing comments for reading, and README examples are laid out to
# be read rather than to be canonical source. The codebase is the formatter's job.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "NPY", "RUF", "D", "T20"]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "E741",  # single-letter names are idiomatic in transport physics (E, Z, A, w)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "T20"]
"examples/*" = ["T20"]  # demos are scripts; print is their interface. The library never prints.
"pyradmc/backends/warp/*" = ["N803", "N806"]  # kernel arg naming follows physics notation
"pyradmc/adapters/ct.py" = ["N813"]  # `import SimpleITK as sitk` is the library's own convention

[tool.ruff.lint.pydocstyle]
convention = "numpy"
